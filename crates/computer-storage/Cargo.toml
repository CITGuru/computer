[package]
name = "computer-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Where a computer daemon keeps box records, traces and frames"
license = "MIT"

[features]
default = ["local"]
local = ["dep:tokio"]
sql = ["dep:sqlx", "dep:tokio"]
sqlite = ["sql", "sqlx/sqlite"]
postgres = ["sql", "sqlx/postgres", "sqlx/tls-rustls-ring"]
s3 = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex", "dep:chrono", "dep:tokio"]
conformance = []

[dependencies]
async-trait = "0.1"
computer-api = { path = "../computer-api", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs"], optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
], optional = true }
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
], optional = true }
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.9", default-features = false, features = [
    "any",
    "runtime-tokio",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
string_slice = "deny"
