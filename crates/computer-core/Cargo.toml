[package]
name = "computer-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A computer in a box: the desktop, and the API that drives it"
license = "MIT"
repository = "https://github.com/CITGuru/computer"
keywords = ["computer-use", "x11", "desktop", "container", "automation"]
categories = ["api-bindings", "development-tools"]

[features]
default = []
microsandbox = ["dep:microsandbox"]
e2b = ["dep:reqwest", "dep:tar", "dep:flate2"]

[dependencies]
async-trait = "0.1"
computer-types = { path = "../computer-types", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
microsandbox = { version = "0.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
], optional = true }
thiserror = "2"
getrandom = "0.3"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "process", "time", "rt", "net", "io-util"] }
sha2 = "0.10"
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[lints.clippy]
string_slice = "deny"
