[package]
name = "computer-spec"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A portable description of a desktop box"
license = "MIT"

# Serde and a digest, and nothing else. Everything that reads a spec depends
# on this — a server, a client, a CLI, and eventually the engine itself — so
# anything heavier here is paid for by all of them.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.clippy]
string_slice = "deny"
