[package]
name = "computer-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An MCP server that gives an agent a desktop"
license = "MIT"

[dependencies]
base64 = "0.22"
computer-api = { path = "../computer-api", version = "0.1.0" }
computer-client = { path = "../computer-client", version = "0.1.0" }
computer-types = { path = "../computer-types", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util"] }
tracing = "0.1"

[lints.clippy]
string_slice = "deny"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
