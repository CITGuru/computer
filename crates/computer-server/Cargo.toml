[package]
name = "computer-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A REST API that manages and drives computer boxes"
license = "MIT"

[dependencies]
computer = { path = "../.." }
computer-types = { path = "../computer-types" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
# Frames are addressed by content so a screen that has not moved costs no
# bytes. A collision would hand back a stale picture, which is the one bug
# this API must not have — so a real digest rather than the FNV the image
# tags use.
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.clippy]
string_slice = "deny"
