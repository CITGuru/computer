[package]
name = "holm-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An MCP server that gives an agent a desktop"
license = "MIT"

[dependencies]
base64 = "0.22"
holm-api = { path = "../holm-api", version = "0.1.0" }
holm-client = { path = "../holm-client", version = "0.1.0" }
holm-types = { path = "../holm-types", version = "0.1.0" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util"] }
tracing = "0.1"

[lints.clippy]
string_slice = "deny"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
