[package]
name = "computer-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The computer command"
license = "MIT"

[dependencies]
axum = "0.8"
computer = { path = "../.." }
computer-api = { path = "../computer-api" }
computer-client = { path = "../computer-client" }
computer-server = { path = "../computer-server" }
computer-types = { path = "../computer-types" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net"] }

[lints.clippy]
string_slice = "deny"

[[bin]]
name = "computer"
path = "src/main.rs"
