name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  features:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: holm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: The API with nothing behind it
        run: cargo clippy -p holm --no-default-features --locked -- -D warnings

      - name: Every storage backend
        run: |
          cargo clippy -p holm-storage --all-targets --locked \
            --features sqlite,postgres,s3,conformance -- -D warnings
          cargo test -p holm-storage --locked --features sqlite,postgres,s3
        env:
          HOLM_STORAGE_POSTGRES_URL: postgres://postgres:holm@127.0.0.1:5432/postgres

      - name: The commands, with everything a daemon can be built with
        run: |
          cargo clippy -p holm --all-targets --locked \
            --features sqlite,postgres,s3,e2b,vercel,daytona,modal -- -D warnings
          cargo test -p holm-server --locked --features sqlite,s3

      - name: A box in a microVM
        run: cargo clippy -p holm-core --all-targets --locked --features microsandbox -- -D warnings

      - name: A box on Vercel
        run: |
          cargo clippy -p holm-core --all-targets --locked --features vercel -- -D warnings
          cargo test -p holm-core --locked --features vercel vercel

      - name: A box on Daytona
        run: |
          cargo clippy -p holm-core --all-targets --locked --features daytona -- -D warnings
          cargo test -p holm-core --locked --features daytona daytona

      - name: A box on Modal
        run: |
          cargo clippy -p holm-core --all-targets --locked --features modal -- -D warnings
          cargo test -p holm-core --locked --features modal modal

  docs:
    runs-on: ubuntu-22.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked --all-features

  page:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/holm-mcp/ui/package-lock.json
      - name: The committed page is what its source builds
        run: |
          crates/holm-mcp/ui/build.sh
          git diff --exit-code -- crates/holm-mcp/ui/screen.html

  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sh -n scripts/install.sh
      - run: shellcheck -s sh scripts/install.sh
      - run: bash -n scripts/release.sh
      - name: The scripts that go inside an image
        run: |
          for script in crates/holm-core/images/*/*.sh; do
            bash -n "$script"
          done
      - name: The scripts this crate evaluates inside a page
        run: python3 scripts/check-page-scripts.py
      - name: It knows this machine
        run: |
          test "$(sh scripts/install.sh --print-target)" = x86_64-unknown-linux-gnu
