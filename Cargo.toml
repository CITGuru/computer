[package]
name = "computer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A computer in a box: an X11 desktop in a container, driven from Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CITGuru/computer"
keywords = ["computer-use", "x11", "desktop", "container", "automation"]
categories = ["api-bindings", "development-tools"]

[features]
# On, because `cargo install computer` builds what is on and the commands are
# half of what this crate is. A caller who wants the API alone and none of a
# server's dependencies takes it with `default-features = false`.
default = ["cli"]
cli = ["dep:computer-cli", "dep:tokio"]
# The desktop in a microVM, and the desktop in somebody else's cloud. Forwarded
# rather than declared: what they turn on is the API's, not this crate's.
microsandbox = ["computer-core/microsandbox"]
e2b = ["computer-core/e2b", "computer-cli?/e2b"]
# What a daemon can keep its records in, forwarded the same way.
sqlite = ["computer-cli?/sqlite"]
postgres = ["computer-cli?/postgres"]
s3 = ["computer-cli?/s3"]

# The API, re-exported whole. Nothing else is in the library half of this crate.
[dependencies]
computer-core = { path = "crates/computer-core", version = "0.1.0" }
computer-cli = { path = "crates/computer-cli", version = "0.1.0", optional = true }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
], optional = true }

# The vocabulary a spec is written in, which a test writes one with directly.
[dev-dependencies.computer-types]
path = "crates/computer-types"
version = "0.1.0"

# What the tests and examples reach for beyond the API itself.
[dev-dependencies]
# An example that implements a seam needs the same attribute the trait was
# written with.
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `test-util` for a paused clock: a reaper waits ten seconds between asks,
# and a test that really waited would be the slowest thing in the suite.
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "test-util",
] }

[lints.clippy]
string_slice = "deny"

[[bin]]
name = "computer"
path = "src/bin/computer.rs"
required-features = ["cli"]

[[bin]]
name = "computerd"
path = "src/bin/computerd.rs"
required-features = ["cli"]

[[example]]
name = "e2b"
path = "examples/e2b.rs"
required-features = ["e2b"]

[[example]]
name = "e2b_takeover"
path = "examples/e2b_takeover.rs"
required-features = ["e2b"]

# Listed rather than globbed: `crates/macos-vm` is an empty directory and a
# glob would fail on it.
[workspace]
members = [
    "crates/computer-core",
    "crates/computer-types",
    "crates/computer-cli",
    "crates/computer-api",
    "crates/computer-client",
    "crates/computer-server",
    "crates/computer-mcp",
    "crates/computer-storage",
]
