[package]
name = "holm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A computer in a box: an X11 desktop in a container, driven from Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CITGuru/computer"
keywords = ["computer-use", "x11", "desktop", "container", "automation"]
categories = ["api-bindings", "development-tools"]

[features]
default = ["cli"]
cli = ["dep:holm-cli", "dep:tokio", "dep:libc"]
microsandbox = ["holm-core/microsandbox"]
e2b = ["holm-core/e2b", "holm-cli?/e2b"]
vercel = ["holm-core/vercel", "holm-cli?/vercel"]
daytona = ["holm-core/daytona", "holm-cli?/daytona"]
modal = ["holm-core/modal", "holm-cli?/modal"]
sqlite = ["holm-cli?/sqlite"]
postgres = ["holm-cli?/postgres"]
s3 = ["holm-cli?/s3"]

[dependencies]
holm-core = { path = "crates/holm-core", version = "0.1.0" }
holm-cli = { path = "crates/holm-cli", version = "0.1.0", optional = true }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies.holm-types]
path = "crates/holm-types"
version = "0.1.0"

[dev-dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "test-util",
] }

[lints.clippy]
string_slice = "deny"

[[bin]]
name = "holm"
path = "src/bin/holm.rs"
required-features = ["cli"]

[[bin]]
name = "holmd"
path = "src/bin/holmd.rs"
required-features = ["cli"]

[[example]]
name = "e2b"
path = "examples/e2b.rs"
required-features = ["e2b"]

[[example]]
name = "vercel"
path = "examples/vercel.rs"
required-features = ["vercel"]

[[example]]
name = "daytona"
path = "examples/daytona.rs"
required-features = ["daytona"]

[[example]]
name = "modal"
path = "examples/modal.rs"
required-features = ["modal"]

[[example]]
name = "e2b_takeover"
path = "examples/e2b_takeover.rs"
required-features = ["e2b"]

# Listed, not globbed: `crates/macos-vm` is an empty directory a glob would fail on.
[workspace]
members = [
    "crates/holm-core",
    "crates/holm-types",
    "crates/holm-cli",
    "crates/holm-api",
    "crates/holm-client",
    "crates/holm-server",
    "crates/holm-mcp",
    "crates/holm-storage",
]
# Kept out of the workspace, not just out of git: a member nothing checks out
# fails `cargo metadata` for everyone but the machine that has it.
exclude = ["demos"]
